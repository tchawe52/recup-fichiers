name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Compiler en .exe (version portable, un seul fichier)
        run: |
          pyinstaller --onefile --noconsole --name RecupFichiers recovery_app.py

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: RecupFichiers-Windows
          path: dist/RecupFichiers.exe
